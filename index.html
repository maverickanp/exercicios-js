<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.NET Interview Coach</title>
  <meta name="description" content="Immersive trainer for .NET/C# job interviews in English.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <link rel="stylesheet" href="src/css/app.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon">🎙️</span>
        <div>
          <div class="brand-title">.NET Interview Coach</div>
          <div class="brand-sub">Practice in English</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/home" data-route="home"><span>🏠</span> Today</a>
        <a href="#/drill" data-route="drill"><span>🎯</span> Interview Drill</a>
        <a href="#/mock" data-route="mock"><span>🎤</span> Mock Interview</a>
        <a href="#/stories" data-route="stories"><span>📖</span> My Stories</a>
        <a href="#/flashcards" data-route="flashcards"><span>🃏</span> Flashcards</a>
        <a href="#/phrases" data-route="phrases"><span>💬</span> Phrasebook</a>
        <a href="#/code" data-route="code"><span>💻</span> Code Talk</a>
        <a href="#/progress" data-route="progress"><span>📈</span> Progress</a>
      </nav>
      <div class="sidebar-footer">
        <label class="switch">
          <input type="checkbox" id="coach-toggle">
          <span>🇧🇷 Coach hints (PT)</span>
        </label>
        <label class="field-inline">
          <span>Voice speed</span>
          <input type="range" id="rate-range" min="0.6" max="1.3" step="0.1">
        </label>
        <label class="field-inline">
          <span>Voice</span>
          <select id="voice-select"></select>
        </label>
        <div class="speech-status" id="speech-status"></div>
      </div>
    </aside>
    <main class="main" id="main"></main>
    <nav class="bottom-nav" id="bottom-nav">
      <a href="#/home" data-route="home">🏠</a>
      <a href="#/drill" data-route="drill">🎯</a>
      <a href="#/mock" data-route="mock">🎤</a>
      <a href="#/stories" data-route="stories">📖</a>
      <a href="#/flashcards" data-route="flashcards">🃏</a>
      <a href="#/phrases" data-route="phrases">💬</a>
      <a href="#/code" data-route="code">💻</a>
      <a href="#/progress" data-route="progress">📈</a>
    </nav>
    <div class="toast" id="toast"></div>
  </div>

  <!-- core logic (also unit-tested in Node) -->
  <script src="src/js/core/storage.js"></script>
  <script src="src/js/core/srs.js"></script>
  <script src="src/js/core/scoring.js"></script>
  <script src="src/js/core/progress.js"></script>
  <!-- content -->
  <script src="src/data/questions.js"></script>
  <script src="src/data/behavioral.js"></script>
  <script src="src/data/flashcards.js"></script>
  <script src="src/data/phrases.js"></script>
  <script src="src/data/snippets.js"></script>
  <script src="src/data/plan.js"></script>
  <!-- ui -->
  <script src="src/js/ui.js"></script>
  <script src="src/js/speech.js"></script>
  <script src="src/js/answer-panel.js"></script>
  <script src="src/js/feedback.js"></script>
  <script src="src/js/views/home.js"></script>
  <script src="src/js/views/drill.js"></script>
  <script src="src/js/views/mock.js"></script>
  <script src="src/js/views/stories.js"></script>
  <script src="src/js/views/flashcards.js"></script>
  <script src="src/js/views/phrases.js"></script>
  <script src="src/js/views/code.js"></script>
  <script src="src/js/views/progress.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
